<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../base-modal/index.css" />
  </head>
  <body>
    <div class="modal">
      <h3 id="modal-title">导出销售流水</h3>
      <p id="error"></p>

      <div class="form-group">
        <label>开始日期:</label>
        <input type="date" id="start-date" />
      </div>

      <div class="form-group">
        <label>结束日期:</label>
        <input type="date" id="end-date" />
      </div>

      <div class="modal-actions">
        <button id="export-csv-btn" class="primary-btn">导出 CSV</button>
        <button id="close-modal-btn" class="secondary-btn">取消</button>
      </div>
    </div>

    <script src="../base-modal/index.js"></script>
    <script src="index.js"></script>
  </body>
</html>
