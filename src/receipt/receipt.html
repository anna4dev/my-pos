<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>小票打印模板</title>
    <style>
      /* 针对热敏打印机宽度优化 */
      body {
        width: 200px;
        font-size: 18px;
        margin: 0;
      }

      .header {
        text-align: center;
        margin-bottom: 10px;
      }

      .header p {
        text-align: left;
        font-size: 16px;
      }

      .item-list {
        list-style: none;
        padding: 0;
        margin: 10px 0;
      }

      .item {
        display: grid;
        grid-template-columns: 1fr 30px 50px;
        gap: 3px;
        /* 列之间的间距 */
        margin-bottom: 10px;
      }

      .footer {
        border-top: 1px dashed #000;
        padding-top: 15px;
        text-align: right;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div id="receipt-content"></div>

    <script>
      // 关键：这个函数接收主进程注入的数据并渲染
      window.renderReceipt = function (orderData) {
        const content = document.getElementById("receipt-content");
        let html = `
                <div class="header">
                    <h2>上引咖啡</h2>
                    <p>订单号: ${orderData.orderNo}</p>
                    <p>日期: ${new Date(orderData.createdAt).toLocaleString(
                      "zh-CN"
                    )}</p>
                    <p>---------------------------------</p>
                </div>
                <ul class="item-list">
            `;

        orderData.items.forEach((item) => {
          const options = item.options.length
            ? `(${item.options.join(", ")})`
            : "";
          html += `
                    <li class="item">
                        <span>${item.name} ${options}</span>
                        <span>x${item.count}</span>
                        <span>¥ ${(item.price / 100).toFixed(2)}</span>
                    </li>
                `;
        });

        html += `
                </ul>
                <div class="footer">
                    总计: ¥ ${(orderData.total / 100).toFixed(2)}
                </div>
            `;
        content.innerHTML = html;
      };
    </script>
  </body>
</html>
